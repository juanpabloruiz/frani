services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: frani:latest
    pull_policy: never
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VIRTUAL_HOST: ${APP_DOMAIN:?APP_DOMAIN is required},www.${APP_DOMAIN:?APP_DOMAIN is required}
      VIRTUAL_PORT: 80
    ports:
      - "${APP_PORT:-8082}:80"
    networks:
      - proxy
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./src:/var/www/html
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  db:
    image: mariadb:11.4
    container_name: frani-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      TZ: ${TZ:-America/Argentina/Cordoba}
    networks:
      - proxy
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin:5
    container_name: frani-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${DB_USER}
      PMA_PASSWORD: ${DB_PASSWORD}
      UPLOAD_LIMIT: 64M
      TZ: ${TZ:-America/Argentina/Cordoba}
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8081}:80"
    networks:
      - proxy
    depends_on:
      db:
        condition: service_healthy

networks:
  proxy:
    external: true

volumes:
  mariadb_data:
