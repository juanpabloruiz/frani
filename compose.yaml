services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    image: frani:latest
    pull_policy: never
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VIRTUAL_HOST: ${APP_DOMAIN:?APP_DOMAIN is required},www.${APP_DOMAIN:?APP_DOMAIN is required}
      VIRTUAL_PORT: 80
    ports:
      - "${APP_PORT:-8082}:80"
    networks:
      - proxy
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/') !== false ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./src:/var/www/html
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - .:/var/www/backup:rw

  facebook-worker:
    image: frani:latest
    pull_policy: never
    profiles: [facebook]
    restart: unless-stopped
    env_file:
      - .env
    command: ["php", "/var/www/html/facebook-worker.php", "--loop"]
    volumes:
      - ./src:/var/www/html:ro
    networks:
      - proxy
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4@sha256:d1891ede5a559f1086f55053bb8cc1569b0298338c4d72d71725a7f74f6ba620
    container_name: frani-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      TZ: ${TZ:-America/Argentina/Cordoba}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_520_ci"]
    ports:
      - "127.0.0.1:${MARIADB_PORT:-3307}:3306"
    networks:
      - proxy
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin:5.2.3@sha256:f54a37b908b26caa7032c4eb0c7f3495fdd90208a06eed9c4b2c8e691dd1662c
    container_name: frani-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: frani-db
      PMA_PORT: 3306
      PMA_USER: ${DB_USER}
      PMA_PASSWORD: ${DB_PASSWORD}
      UPLOAD_LIMIT: 64M
      TZ: ${TZ:-America/Argentina/Cordoba}
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8081}:80"
    networks:
      - proxy
    depends_on:
      db:
        condition: service_healthy

  sincro:
    image: frani:latest
    pull_policy: never
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-c"]
    command: ["/script.sh"]
    env_file:
      - .env
    environment:
      TZ: ${TZ:-America/Argentina/Cordoba}
    volumes:
      - .:/app/proyecto:ro
      - ${HOME}/MEGA/frani:/mega:rw
      - ./sincro_contenedor.sh:/script.sh:ro
    networks:
      - proxy
    depends_on:
      db:
        condition: service_healthy

networks:
  proxy:
    external: true

volumes:
  mariadb_data:
