services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: frani:latest
    pull_policy: never
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VIRTUAL_HOST: ${APP_DOMAIN:?APP_DOMAIN is required},www.${APP_DOMAIN:?APP_DOMAIN is required}
      VIRTUAL_PORT: 80
    ports:
      - "${APP_PORT:-8082}:80"
    networks:
      - proxy
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/') !== false ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./src:/var/www/html
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - .:/var/www/backup:rw

  facebook-worker:
    image: frani:latest
    pull_policy: never
    profiles: [facebook]
    restart: unless-stopped
    env_file:
      - .env
    command: ["php", "/var/www/html/facebook-worker.php", "--loop"]
    volumes:
      - ./src:/var/www/html:ro
    networks:
      - proxy
    depends_on:
      db:
        condition: service_healthy

  db:
    image: container-registry.oracle.com/mysql/community-server:26.10.0-aarch64@sha256:8f32e012b7ebf9005f1b2fb64a72ce0830b6775d17dd44f2c75c6ed791a0d2ae
    container_name: frani-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: ${TZ:-America/Argentina/Cordoba}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_520_ci"]
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    networks:
      - proxy
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -uroot -N -e 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:5.2.3@sha256:32849b6265c3e9f62d03636a056da7da33b16fb3aa3f8b477d1f3974be7c1aa3
    container_name: frani-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: frani-db
      PMA_PORT: 3306
      PMA_USER: ${DB_USER}
      PMA_PASSWORD: ${DB_PASSWORD}
      UPLOAD_LIMIT: 64M
      TZ: ${TZ:-America/Argentina/Cordoba}
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8081}:80"
    networks:
      - proxy
    depends_on:
      db:
        condition: service_healthy

  sincro:
    image: frani:latest
    pull_policy: never
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-c"]
    command: ["/script.sh"]
    env_file:
      - .env
    environment:
      TZ: ${TZ:-America/Argentina/Cordoba}
    volumes:
      - .:/app/proyecto:ro
      - ${HOME}/MEGA/frani:/mega:rw
      - ./sincro_contenedor.sh:/script.sh:ro
    networks:
      - proxy
    depends_on:
      db:
        condition: service_healthy

networks:
  proxy:
    external: true

volumes:
  mysql_data:
    external: true
    name: frani_mysql_data
