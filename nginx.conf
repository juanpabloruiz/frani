worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        root /var/www/html;
        index index.php index.html;

        client_max_body_size 32M;
        absolute_redirect off;

        location /productos/ {
            rewrite ^/productos/([a-z0-9]+(?:-[a-z0-9]+)*)/?$ /producto.php?uri=$1? last;
            return 404;
        }

        location / {
            try_files $uri $uri/ @php_fallback;
        }

        location @php_fallback {
            # Mantener los endpoints PHP existentes, incluyendo el panel.
            if (-f $request_filename.php) {
                rewrite ^(.+)$ $1.php last;
            }
            rewrite ^/([a-z0-9]+(?:-[a-z0-9]+)*)/([a-z0-9]+(?:-[a-z0-9]+)*)/?$ /producto.php?categoria=$1&uri=$2? last;
            rewrite ^/([a-z0-9]+(?:-[a-z0-9]+)*)/?$ /categoria.php?uri=$1? last;
            return 404;
        }

        location ~ \.php$ {
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_index index.php;
            fastcgi_pass 127.0.0.1:9000;
        }

        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2|ttf)$ {
            expires 7d;
            add_header Cache-Control "public";
            access_log off;
        }
    }
}
